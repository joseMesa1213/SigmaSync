<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SigmaSync · Operación</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --texto: #1d2330; --suave: #5d6677; --borde: #dde1e8;
    --acento: #2453c9; --ok: #1f7a46; --warn: #a15c00; --error: #b4232c; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --texto: #e6e9ef; --suave: #9aa3b2; --borde: #2c323c;
            --acento: #7ea2ff; --ok: #5ccf8b; --warn: #f0b04a; --error: #ff7a80; --chip: #262b34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--texto); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--borde); }
  h1 { font-size: 16px; margin: 0; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  nav { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  nav button { background: none; border: 1px solid transparent; color: var(--suave); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav button.activo { background: var(--panel); border-color: var(--borde); color: var(--texto); font-weight: 600; }
  .caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 8px; padding: 12px; margin-bottom: 12px; overflow-x: auto; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  input, select, button.acc { font: inherit; padding: 5px 8px; border: 1px solid var(--borde); border-radius: 6px; background: var(--panel); color: var(--texto); }
  button.acc { cursor: pointer; }
  button.acc:hover { border-color: var(--acento); color: var(--acento); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--chip); font-size: 12px; font-weight: 600; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .error { color: var(--error); }
  .resumen { display: flex; flex-wrap: wrap; gap: 8px; }
  .resumen div { background: var(--chip); border-radius: 6px; padding: 6px 10px; }
  .resumen b { font-size: 18px; display: block; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--chip); padding: 10px; border-radius: 6px; max-height: 420px; overflow: auto; }
  .msg { color: var(--suave); }
  .oculto { display: none; }
</style>
</head>
<body>
<header>
  <h1>SigmaSync · Operación</h1>
  <div class="filtros" style="margin:0">
    <input id="clave" type="password" placeholder="Clave de administración" autocomplete="off">
    <button class="acc" id="entrar">Conectar</button>
    <span id="estado" class="msg"></span>
  </div>
</header>
<main>
  <nav>
    <button data-vista="nodos" class="activo">Nodos</button>
    <button data-vista="mensajes">Mensajes</button>
    <button data-vista="alertas">Alertas</button>
  </nav>

  <section id="v-nodos">
    <div class="caja"><div class="resumen" id="resumen"></div></div>
    <div class="caja"><table id="t-nodos"></table></div>
  </section>

  <section id="v-mensajes" class="oculto">
    <div class="caja">
      <div class="filtros">
        <select id="f-estado">
          <option value="">Todos los estados</option>
          <option>DLQ</option><option>RECHAZADO</option><option>PENDIENTE</option><option>EN_PROCESO</option>
          <option>CONFIRMADO</option><option>DESCARTADO</option>
        </select>
        <input id="f-nodo" placeholder="Nodo (origen o destino)" size="16">
        <button class="acc" id="buscar">Buscar</button>
      </div>
      <table id="t-mensajes"></table>
    </div>
    <div class="caja oculto" id="detalle"></div>
  </section>

  <section id="v-alertas" class="oculto">
    <div class="caja">
      <div class="filtros">
        <input id="a-nodo" placeholder="Nodo" size="12">
        <label><input type="checkbox" id="a-pend"> Solo sin notificar</label>
        <button class="acc" id="a-buscar">Buscar</button>
      </div>
      <table id="t-alertas"></table>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fecha = s => s ? new Date(/[zZ]|[+-]\d\d:\d\d$/.test(s) ? s : s + "Z").toLocaleString() : "";
const minutosDesde = s => s ? Math.round((Date.now() - new Date(/[zZ]$/.test(s) ? s : s + "Z")) / 60000) : null;
const claseEstado = e => ({ CONFIRMADO: "ok", DLQ: "error", RECHAZADO: "warn", DESCARTADO: "msg", ERROR: "error", WARN: "warn", INFO: "ok" }[e] || "");
let clave = "";
try { clave = sessionStorage.getItem("sigmasync.clave") || ""; } catch { }

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, { ...opciones, headers: { "X-Admin-Key": clave, "Content-Type": "application/json", ...(opciones.headers || {}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `${r.status} ${r.statusText}`);
  return r.status === 204 || r.headers.get("content-length") === "0" ? null : r.json().catch(() => null);
}
function aviso(t, cls = "msg") { const e = $("#estado"); e.className = cls; e.textContent = t; }

async function cargarNodos() {
  const [res, nodos] = await Promise.all([api("/v1/admin/resumen"), api("/v1/admin/nodos")]);
  $("#resumen").innerHTML = ["pendiente", "en_proceso", "dlq", "rechazado", "confirmado", "descartado"]
    .map(k => `<div><b class="${claseEstado(k.toUpperCase())}">${res[k] ?? 0}</b>${k.replace("_", " ")}</div>`).join("");
  $("#t-nodos").innerHTML = `<tr><th>Nodo</th><th>Latido</th><th>Versión</th><th>En cola</th><th>DLQ</th><th>Rechazados</th><th>Outbox pend./error</th><th>Último error del agente</th></tr>` +
    nodos.map(n => {
      const est = n.estado_latido ? JSON.parse(n.estado_latido) : {};
      const min = minutosDesde(n.ultimo_latido);
      const latido = n.sin_latido_desde ? `<span class="error">caído (${min ?? "nunca"} min)</span>`
        : min === null ? `<span class="warn">sin datos</span>` : `<span class="ok">hace ${min} min</span>`;
      return `<tr><td><b>${esc(n.nodo_id)}</b><br><span class="msg">${esc(n.descripcion)}</span></td><td>${latido}</td>
        <td class="mono">${esc(n.version_agente)}</td><td class="num">${n.en_cola}</td><td class="num ${n.en_dlq ? "error" : ""}">${n.en_dlq}</td>
        <td class="num ${n.rechazados ? "warn" : ""}">${n.rechazados}</td><td class="num">${est.outbox_pendientes ?? ""} / ${est.outbox_con_error ?? ""}</td>
        <td class="msg">${esc(est.ultimo_error)}</td></tr>`;
    }).join("");
}

async function cargarMensajes() {
  const q = new URLSearchParams({ estado: $("#f-estado").value, nodo: $("#f-nodo").value.trim(), top: 200 });
  const lista = await api(`/v1/admin/mensajes?${q}`);
  $("#t-mensajes").innerHTML = `<tr><th>Creado</th><th>Tipo</th><th>Origen → destino</th><th>Documento</th><th>Estado</th><th>Int.</th><th>Error</th><th></th></tr>` +
    (lista.length ? lista.map(m => `<tr><td>${fecha(m.creado_ts)}</td><td>${esc(m.tipo)}</td><td>${esc(m.nodo_origen)} → ${esc(m.nodo_destino)}</td>
      <td class="mono">${esc(m.clave_particion)}</td><td><span class="chip ${claseEstado(m.estado)}">${esc(m.estado)}</span></td>
      <td class="num">${m.intentos}</td><td class="msg">${esc(m.error)}</td>
      <td><button class="acc" data-ver="${m.msg_id}">Ver</button>
        ${["DLQ", "RECHAZADO", "DESCARTADO"].includes(m.estado) ? `<button class="acc" data-repro="${m.msg_id}">Reprocesar</button>` : ""}
        ${["DLQ", "RECHAZADO", "PENDIENTE"].includes(m.estado) ? `<button class="acc" data-desc="${m.msg_id}">Descartar</button>` : ""}</td></tr>`).join("")
      : `<tr><td colspan="8" class="msg">Sin mensajes con ese filtro.</td></tr>`);
}

async function verMensaje(id) {
  const d = await api(`/v1/admin/mensajes/${id}`);
  const det = $("#detalle");
  det.classList.remove("oculto");
  det.innerHTML = `<b>${esc(d.mensaje.tipo)}</b> <span class="mono">${esc(d.mensaje.msg_id)}</span>
    <span class="chip ${claseEstado(d.mensaje.estado)}">${esc(d.mensaje.estado)}</span>
    <p class="msg">${esc(d.mensaje.error)}</p><pre>${esc(JSON.stringify(d.sobre, null, 2))}</pre>`;
  det.scrollIntoView({ behavior: "smooth" });
}

async function cargarAlertas() {
  const q = new URLSearchParams({ nodo: $("#a-nodo").value.trim(), pendientes: $("#a-pend").checked, top: 300 });
  const lista = await api(`/v1/admin/alertas?${q}`);
  $("#t-alertas").innerHTML = `<tr><th>Fecha</th><th>Nodo</th><th>Fuente</th><th>Nivel</th><th>Mensaje</th><th>Correo</th></tr>` +
    (lista.length ? lista.map(a => `<tr><td>${fecha(a.ts)}</td><td>${esc(a.nodo_id)}</td><td>${esc(a.fuente)}</td>
      <td><span class="chip ${claseEstado(a.nivel)}">${esc(a.nivel)}</span></td>
      <td>${esc(a.mensaje)}${a.msg_id ? ` <button class="acc" data-ver-alerta="${a.msg_id}">Ver mensaje</button>` : ""}</td>
      <td>${a.notificada ? "enviado" : "pendiente"}</td></tr>`).join("")
      : `<tr><td colspan="6" class="msg">Sin alertas.</td></tr>`);
}

const vistas = { nodos: cargarNodos, mensajes: cargarMensajes, alertas: cargarAlertas };
let vista = "nodos";
async function refrescar() {
  if (!clave) return aviso("Ingrese la clave de administración.");
  try { await vistas[vista](); aviso(`Actualizado ${new Date().toLocaleTimeString()}`, "ok"); }
  catch (e) { aviso(e.message, "error"); }
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("activo", x === b));
  vista = b.dataset.vista;
  Object.keys(vistas).forEach(k => $(`#v-${k}`).classList.toggle("oculto", k !== vista));
  refrescar();
});
$("#entrar").onclick = () => { clave = $("#clave").value; try { sessionStorage.setItem("sigmasync.clave", clave); } catch { } refrescar(); };
$("#buscar").onclick = refrescar;
$("#a-buscar").onclick = refrescar;
document.addEventListener("click", async e => {
  const t = e.target;
  try {
    if (t.dataset.ver) await verMensaje(t.dataset.ver);
    if (t.dataset.verAlerta) { document.querySelector('nav [data-vista="mensajes"]').click(); await verMensaje(t.dataset.verAlerta); }
    if (t.dataset.repro && confirm("¿Devolver este mensaje a la cola para procesarlo de nuevo?")) {
      await api(`/v1/admin/mensajes/${t.dataset.repro}/reprocesar`, { method: "POST" }); await refrescar();
    }
    if (t.dataset.desc) {
      const motivo = prompt("Motivo del descarte (queda registrado):");
      if (motivo) { await api(`/v1/admin/mensajes/${t.dataset.desc}/descartar`, { method: "POST", body: JSON.stringify({ motivo }) }); await refrescar(); }
    }
  } catch (err) { aviso(err.message, "error"); }
});
if (clave) { $("#clave").value = clave; refrescar(); }
setInterval(() => { if (vista === "nodos") refrescar(); }, 60000);
</script>
</body>
</html>
